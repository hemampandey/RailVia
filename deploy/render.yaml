# Render blueprint. One service: the API, serving the UI it was built with.
#
#   1. Push this repo to GitHub
#   2. Render → New → Blueprint → point it at this file
#   3. Fill in the four environment variables below
#
# The two NEXT_PUBLIC_* values are baked into the UI at build time, so
# changing them needs a redeploy, not just a restart. They are safe to expose:
# the anon key is designed for browsers, and row-level security is what
# protects the data.
services:
  - type: web
    name: railvia
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: starter          # 'free' works but sleeps after inactivity
    healthCheckPath: /api/health
    envVars:
      # A 512 MB instance is OOM-killed at 4 search workers and above: each
      # worker holds its own copy of the search state, and the solve peaks at
      # 498 MB with 4 and 651 MB with 8. Two is also the best quality
      # measured, so this costs nothing. See DEFAULT_WORKERS in
      # src/optimiser/model.py.
      - key: SOLVER_WORKERS
        value: "2"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
