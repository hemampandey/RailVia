<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automatic Block Planning — SIH26027</title>
<style>
  :root {
    --bg:#0f1419; --panel:#161c24; --panel2:#1d2530; --line:#2a3441;
    --ink:#e6edf3; --muted:#8b97a6; --accent:#4a9eff;
    --engg:#e8833a; --trd:#7c5cd6; --snt:#2eb88a; --shared:#f0c040;
    --bad:#e05252; --good:#2eb88a;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); background:var(--panel); }
  h1 { margin:0 0 4px; font-size:19px; font-weight:650; letter-spacing:-.01em; }
  .prov { font-size:12px; color:var(--muted); }
  .prov b { color:var(--good); font-weight:600; }
  .prov i { color:var(--shared); font-style:normal; font-weight:600; }
  main { padding:20px 24px 60px; max-width:1500px; }
  .controls { display:flex; gap:14px; align-items:end; flex-wrap:wrap; margin-bottom:20px; }
  label { display:block; font-size:11px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--muted); margin-bottom:5px; }
  select, button { background:var(--panel2); color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:7px 11px; font-size:13px; }
  button { cursor:pointer; border-color:var(--accent); color:var(--accent); font-weight:600; }
  button:hover:not(:disabled) { background:var(--accent); color:#08101a; }
  button:disabled { opacity:.5; cursor:default; }
  .tabs { display:flex; gap:2px; margin-bottom:18px; border-bottom:1px solid var(--line); }
  .tab { padding:9px 16px; cursor:pointer; color:var(--muted); font-size:13px;
    border-bottom:2px solid transparent; }
  .tab.on { color:var(--ink); border-bottom-color:var(--accent); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr));
    gap:12px; margin-bottom:22px; }
  .kpi { background:var(--panel); border:1px solid var(--line);
    border-radius:9px; padding:14px 16px; }
  .kpi .v { font-size:25px; font-weight:660; letter-spacing:-.02em; }
  .kpi .l { font-size:11px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.05em; margin-top:3px; }
  .kpi .s { font-size:11px; color:var(--muted); margin-top:5px; }
  .panel { background:var(--panel); border:1px solid var(--line);
    border-radius:9px; padding:16px; margin-bottom:18px; }
  .panel h2 { margin:0 0 12px; font-size:14px; font-weight:620; }
  .panel h2 span { font-weight:400; color:var(--muted); font-size:12px; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:11px;
    text-transform:uppercase; letter-spacing:.05em; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12px;
    color:var(--muted); margin-bottom:10px; }
  .sw { display:inline-block; width:11px; height:11px; border-radius:3px;
    margin-right:5px; vertical-align:-1px; }
  .loading { color:var(--muted); padding:30px; text-align:center; }
  .err { color:var(--bad); padding:14px; }
  .bar { height:7px; background:var(--panel2); border-radius:4px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .hide { display:none; }
  .tip { position:fixed; background:#0a0e13; border:1px solid var(--line);
    border-radius:7px; padding:9px 11px; font-size:12px; pointer-events:none;
    z-index:50; max-width:330px; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  .win { font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Automatic Block Planning · SIH26027</h1>
  <div class="prov" id="prov">loading…</div>
</header>
<main>
  <div class="controls">
    <div><label>Horizon</label><select id="days">
      <option value="7">Weekly (7 days)</option>
      <option value="30" selected>Monthly (30 days)</option></select></div>
    <div><label>Backlog size</label><select id="tasks">
      <option value="60">60 tasks</option><option value="120" selected>120 tasks</option>
      <option value="300">300 tasks</option></select></div>
    <div><label>Data</label><select id="grounded">
      <option value="true" selected>Real timetable</option>
      <option value="false">Fully synthetic</option></select></div>
    <div><label>Solver budget</label><select id="tl">
      <option value="15">15 s</option><option value="30" selected>30 s</option>
      <option value="60">60 s</option></select></div>
    <button id="go">Re-plan</button>
  </div>

  <div class="tabs">
    <div class="tab on" data-v="plan">Block plan</div>
    <div class="tab" data-v="compare">Before / after</div>
    <div class="tab" data-v="ml">Criticality</div>
    <div class="tab" data-v="sections">Sections</div>
  </div>

  <div id="view"><div class="loading">Loading…</div></div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
