<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Planner — SIH26027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fb; --surface:#fff; --surface-2:#eef3f9; --surface-3:#e3ebf5;
  --border:#c9d6e6; --border-soft:#dde6f1;
  --text:#0f172a; --text-muted:#415064; --text-faint:#51617a;
  --primary:#1e40af; --primary-soft:#e5edff; --on-primary:#fff;
  --accent:#b45309; --accent-soft:#fdf0dd;
  --good:#0f7a5a; --good-soft:#dff5ed;
  --bad:#c2261d; --bad-soft:#fde8e6;
  --engg:#b45309; --trd:#6d28d9; --snt:#0f766e;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);
  --radius:9px; --radius-sm:6px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --font-sans:"Fira Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Fira Code",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#0a1020; --surface:#111a2b; --surface-2:#182337; --surface-3:#1f2d45;
  --border:#2c3d57; --border-soft:#223148;
  --text:#e9f0fa; --text-muted:#aebdd2; --text-faint:#9aabc2;
  --primary:#7aa8ff; --primary-soft:#17233d; --on-primary:#0a1020;
  --accent:#f0a336; --accent-soft:#2e2312;
  --good:#4ecfa4; --good-soft:#10291f;
  --bad:#ff7a6e; --bad-soft:#2e1614;
  --engg:#f0a336; --trd:#a78bfa; --snt:#3fc7a8;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1020; --surface:#111a2b; --surface-2:#182337; --surface-3:#1f2d45;
  --border:#2c3d57; --border-soft:#223148;
  --text:#e9f0fa; --text-muted:#aebdd2; --text-faint:#9aabc2;
  --primary:#7aa8ff; --primary-soft:#17233d; --on-primary:#0a1020;
  --accent:#f0a336; --accent-soft:#2e2312;
  --good:#4ecfa4; --good-soft:#10291f;
  --bad:#ff7a6e; --bad-soft:#2e1614;
  --engg:#f0a336; --trd:#a78bfa; --snt:#3fc7a8;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.55 var(--font-sans);-webkit-font-smoothing:antialiased}
.num,.mono,td.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
:where(a,button,select,summary,[tabindex]):focus-visible{
  outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--radius-sm)}
.skip{position:absolute;left:12px;top:-48px;z-index:100;background:var(--primary);
  color:var(--on-primary);padding:8px 16px;border-radius:6px;transition:top .15s}
.skip:focus{top:12px}

header{background:var(--surface);border-bottom:1px solid var(--border);
  padding:var(--s4) var(--s5)}
.hrow{display:flex;align-items:center;gap:var(--s4)}
.hrow > :first-child{flex:1 1 auto;min-width:0}
h1{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:var(--s2)}
h1 .mark{width:21px;height:21px;border-radius:5px;background:var(--primary);
  color:var(--on-primary);display:grid;place-items:center;flex:none}
.sub{font-size:12px;color:var(--text-faint);margin-top:2px}
button,select{font:inherit;font-size:13.5px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  padding:8px 12px;min-height:44px;cursor:pointer;
  transition:background-color .15s ease-out,border-color .15s ease-out}
button:hover:not(:disabled),select:hover{border-color:var(--primary)}
button:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:44px;padding:0;display:inline-grid;place-items:center;flex:none}

main{padding:var(--s5);max-width:1080px;margin:0 auto}

/* ── The decision bar: what am I looking at, what needs me ─────────── */
.brief{background:var(--surface);border:1px solid var(--border-soft);
  border-radius:var(--radius);padding:var(--s4) var(--s5);margin-bottom:var(--s4);
  box-shadow:var(--shadow)}
.brief-top{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.brief h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.015em}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-sm);
  overflow:hidden;margin-left:auto}
.seg button{border:none;border-radius:0;background:transparent;min-height:38px;
  padding:6px 14px;font-size:13px;color:var(--text-muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);font-weight:600}
.facts{display:flex;gap:var(--s5);flex-wrap:wrap;margin-top:var(--s3)}
.fact{display:flex;flex-direction:column;gap:1px}
.fact b{font-size:21px;font-weight:700;letter-spacing:-.02em}
.fact span{font-size:11.5px;color:var(--text-faint)}
.fact.win b{color:var(--good)}
.fact.warn b{color:var(--bad)}

/* ── Exceptions: the thing that actually needs a human ─────────────── */
.exc{border:1px solid var(--bad);background:var(--bad-soft);
  border-radius:var(--radius);margin-bottom:var(--s4);overflow:hidden}
.exc > summary{padding:var(--s3) var(--s4);cursor:pointer;font-weight:600;
  font-size:14px;color:var(--bad);list-style:none;display:flex;
  align-items:center;gap:var(--s2);min-height:44px}
.exc > summary::-webkit-details-marker{display:none}
.exc[open] > summary{border-bottom:1px solid rgba(0,0,0,.08)}
.exc-body{background:var(--surface);padding:var(--s2) 0}
.exc-row{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);
  padding:var(--s3) var(--s4);border-bottom:1px solid var(--border-soft);
  align-items:start;font-size:13.5px}
.exc-row:last-child{border-bottom:none}
.exc-row .why{color:var(--text-muted);font-size:12.5px;margin-top:2px}
.exc-row .fix{color:var(--text-faint);font-size:12px;margin-top:2px;font-style:italic}

/* ── The worklist ──────────────────────────────────────────────────── */
.day{margin:var(--s5) 0 var(--s3);font-size:12px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);
  display:flex;align-items:center;gap:var(--s3)}
.day::after{content:"";flex:1;height:1px;background:var(--border-soft)}
.block{background:var(--surface);border:1px solid var(--border-soft);
  border-left:4px solid var(--border);border-radius:var(--radius);
  padding:var(--s3) var(--s4);margin-bottom:var(--s2);display:grid;
  grid-template-columns:104px 1fr auto;gap:var(--s4);align-items:center;
  box-shadow:var(--shadow)}
.block.shared{border-left-color:var(--good)}
.block.has-overdue{border-left-color:var(--bad)}
.block.done{opacity:.55}
.when{font-family:var(--font-mono);font-size:13px;font-weight:600;line-height:1.35}
.when small{display:block;font-weight:400;color:var(--text-faint);font-size:11px}
.what .where{font-weight:600;font-size:14px}
.what .where code{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);
  font-weight:400;margin-left:6px}
.jobs{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px}
.job{display:inline-flex;align-items:center;gap:5px;font-size:12px;
  padding:2px 8px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--border-soft);color:var(--text-muted)}
.job i{width:7px;height:7px;border-radius:2px;flex:none;font-style:normal}
.job.od{border-color:var(--bad);color:var(--bad)}
.cost{text-align:right;white-space:nowrap}
.cost b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.cost span{display:block;font-size:11px;color:var(--text-faint)}
.save{color:var(--good);font-size:12px;font-weight:600;margin-top:3px;display:block}
.acts{display:flex;gap:var(--s2);margin-top:var(--s2)}
.acts button{min-height:34px;padding:5px 12px;font-size:12.5px}
.acts .on{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}

.note{font-size:12.5px;color:var(--text-muted);line-height:1.6;max-width:74ch}
.panel{background:var(--surface);border:1px solid var(--border-soft);
  border-radius:var(--radius);padding:var(--s4);margin-bottom:var(--s4);
  box-shadow:var(--shadow)}
.panel h3{margin:0 0 var(--s3);font-size:14px;font-weight:650}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border-soft)}
th{color:var(--text-faint);font-weight:600;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right}
.scroll{overflow-x:auto}
.settings{margin-top:var(--s5);font-size:12.5px;color:var(--text-faint)}
.settings summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
.settings .row{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s3);
  align-items:end}
.settings label{display:block;font-size:10.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:4px}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s2)}
.chip{font-family:var(--font-mono);font-size:10.5px;padding:2px 8px;
  border-radius:999px;background:var(--surface-2);color:var(--text-muted);
  border:1px solid var(--border-soft)}
.chip.real{background:var(--good-soft);color:var(--good);border-color:transparent;font-weight:600}
.chip.syn{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.status{display:flex;align-items:center;gap:var(--s2);color:var(--text-muted);
  font-size:13.5px;padding:var(--s6) 0;justify-content:center}
.spin{width:15px;height:15px;border:2px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sk{background:var(--surface-3);border-radius:var(--radius);
  animation:pulse 1.4s ease-in-out infinite;height:74px;margin-bottom:var(--s2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.err{color:var(--bad);background:var(--bad-soft);padding:var(--s4);border-radius:var(--radius)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:700px){
  main,header{padding:var(--s4)}
  .block{grid-template-columns:1fr;gap:var(--s2)}
  .cost{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;
  transition-duration:.01ms!important}}
</style>
</head>
<body>
<a class="skip" href="#work">Skip to the plan</a>
<header>
  <div class="hrow">
    <div>
      <h1><span class="mark" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h10"/></svg></span>Block Planner</h1>
      <div class="sub">Divisional maintenance blocks · SIH26027</div>
    </div>
    <button class="icon-btn" id="theme" type="button" aria-label="Switch colour theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<main id="work">
  <div id="view"></div>
  <p aria-live="polite" class="vh" id="live"></p>
</main>
<script src="/static/app.js"></script>
</body>
</html>
